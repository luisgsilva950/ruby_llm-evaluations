services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ruby_llm_evaluations
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - evaluation_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruby_llm_evaluations"]
      interval: 1s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev-only
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - evaluation_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  evaluation_postgres:
  evaluation_mysql:
